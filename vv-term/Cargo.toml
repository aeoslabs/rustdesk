[package]
name = "vv-term"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Headless RustDesk terminal client: run one command on a peer and print its output"

# Own workspace root, so it builds without the full rustdesk crate.
[workspace]

[dependencies]
hbb_common = { path = "../libs/hbb_common" }
# the generated protobuf code refers to ::protobuf and ::bytes directly
protobuf = { version = "3.7", features = ["with-bytes"] }
bytes = "1.10"

[build-dependencies]
protobuf-codegen = { version = "3.7" }

[profile.release]
opt-level = "s"
codegen-units = 4
strip = true
